  nn: no name
  lrg: large
  lg: large
  xl: extra large
  med: medium
  sm: small
  ft: facial tissue          # "Royale FT 6x126" - VERIFY
  bt: bathroom tissue
  pt: paper towel
  jms: schneiders            # J.M. Schneider - VERIFY
  bnls: boneless
  sknls: skinless
  ckn: chicken
  chkn: chicken
  frzn: frozen
  org: organic
  asst: assorted
  var: varieties
  pkg: package
  btl: bottle
size_units:
  g: gram
  ct: count
  ea: each
  pk: pack
