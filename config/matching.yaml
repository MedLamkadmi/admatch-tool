# Matching settings (spec §6).

size_tolerance: 0.02            # maximum size difference: 2%
range_rule: overlap             # list range vs flyer range: match when they overlap (Mohamed, 15 Nov 2026)
# Brand rule (Mohamed, 16 Nov 2026) - same rule at Superstore AND at competitors:
#   list names a maker brand  -> the offer must name the same maker brand
#   list names a store brand  -> the offer may name any store brand (store_brands.yaml)
#   list names no brand       -> product + size only
#   list names a brand, offer names none -> not matched, Review: 'brand not stated in flyer'
fuzzy_word_score: 90
max_review_lines_per_item: 8   # close-but-not-matched offers listed per list item in the Review sheet            # spelling tolerance for one word (0-100), words of 5+ letters

# Words that NEVER block a match (variant / flavour / wording), on either side.
variants:
  - selected varieties
  - selected variety
  - assorted varieties
  - assorted
  - all varieties
  - varieties
  - selected
  - and sizes
