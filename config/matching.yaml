# Different words for the same thing. First word is the one used internally.
synonyms:
  - [wiener, hot dog, frankfurter]
  - [kcup, k cup, k-cup]
  - [chip, crisp]
  - [bathroom tissue, toilet paper, toilet tissue]
  - [paper towel, paper towels]
  - [yogurt, yoghurt, yogourt]
  - [tissue, tissues]

# Egg grades are sizes (spec §6): grade must match grade.
grades: [extra large, large, medium, small, jumbo]

# Wording removed from flyer text before the products are read.
remove_patterns:
  - 'product of [a-z .,]*?(?=\d|$|,? (?:no\.? ?1|canada (?:no|fancy|extra)|extra fancy|fancy grade))'
  - '(?:canada )?(?:no\.? ?1|extra fancy|fancy) grade'
  - 'cut from .*$'
  - '(?<![x\d.])\d+(?:\.\d+)?\s*/\s*(?:kg|lb|100 ?g)\b'
  - '\d+(?:-\d+)? per lb'
  - '-?\d+ ?°c'
