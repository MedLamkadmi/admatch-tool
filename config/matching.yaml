# Words forgiven when the FLYER has them and the list does not (colour, cut, type).
# When the LIST has one of these words, the flyer must have it too
# ("Onion Green" needs green; plain "Potatoes" accepts yellow potatoes).
modifiers:
  - red
  - green
  - yellow
  - white
  - orange
  - black
  - brown
  - purple
  - golden
